name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends shellcheck

      - name: Syntax
        run: bash -n vps-setup.sh tests/smoke.sh

      - name: ShellCheck
        run: shellcheck -x --severity=warning vps-setup.sh tests/smoke.sh

      - name: Offline smoke tests
        run: bash tests/smoke.sh

      - name: Compose schema and interpolation
        env:
          COMPOSE_PROJECT_NAME: masterdnsvpn-ci
          MASTERDNS_DOMAIN: v.example.com
          MASTERDNS_IMAGE: ghcr.io/masterking32/masterdnsvpn:latest
        run: docker compose -f templates/compose.yaml config --quiet
